<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Tu compra fue aprobada! · Acceso a tus planos</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#171C22">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --band:#171C22;
  --band-2:#202830;
  --on-band:#EEF2F6;
  --border-d:#2E3842;
  --cta:#E2621A;
  --cta-hover:#FF7A2E;
  --accent:#1E4E7A;

  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:38px 16px 44px;
  background:
    linear-gradient(180deg,rgba(30,78,122,.20),rgba(23,28,34,0) 55%),
    repeating-linear-gradient(0deg,rgba(238,242,246,.045) 0 1px,transparent 1px 34px),
    repeating-linear-gradient(90deg,rgba(238,242,246,.045) 0 1px,transparent 1px 34px),
    var(--band);
  color:var(--on-band);
  font-family:var(--body);
  font-size:16px;
  line-height:1.58;
  -webkit-font-smoothing:antialiased;
}

a:focus-visible{outline:3px solid var(--cta-hover);outline-offset:3px;border-radius:4px}

.wrap{width:100%;max-width:520px;text-align:center}

.check{
  width:72px;height:72px;margin:0 auto 20px;
  border:3px solid var(--cta);
  border-radius:50%;
  display:grid;place-items:center;
  color:var(--cta-hover);
  font-size:2.1rem;font-weight:700;line-height:1;
}

h1{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(2rem,8.6vw,3.1rem);
  line-height:1.05;
  letter-spacing:-.005em;
  margin:0 0 12px;
  color:#fff;
}

.lead{
  font-size:1.03rem;
  color:#B9C6D2;
  margin:0 0 26px;
}

.btn{
  display:block;
  width:100%;
  background:var(--cta);
  color:#fff;
  text-decoration:none;
  font-family:var(--display);
  font-weight:700;
  font-size:1.22rem;
  letter-spacing:.045em;
  text-transform:uppercase;
  text-align:center;
  padding:17px 18px;
  border-radius:var(--r);
  box-shadow:0 3px 0 #A8460F;
}
.btn:hover,.btn:active{background:var(--cta-hover)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #A8460F}

.tip{
  margin:14px 0 0;
  font-size:.85rem;
  line-height:1.5;
  color:#9FB0BF;
}

.guard{
  margin:26px auto 0;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  border:1px dashed var(--border-d);
  background:var(--band-2);
  border-radius:var(--r);
  padding:11px 13px;
}
.guard__ico{
  flex:0 0 auto;
  width:26px;height:26px;
  display:grid;place-items:center;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  font-size:.85rem;font-weight:700;
}
.guard__txt{
  font-size:.84rem;
  line-height:1.4;
  color:#B9C6D2;
}
.guard__txt strong{
  display:block;
  font-family:var(--display);
  font-weight:700;
  font-size:.92rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#fff;
}

@media (min-width:640px){
  .btn{font-size:1.3rem}
  .tip{font-size:.88rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<main class="wrap">
  <p class="check" aria-hidden="true">✓</p>

  <h1>¡Tu compra fue aprobada!</h1>

  <p class="lead">Ya tienes acceso a tu catálogo de planos, la calculadora de precios y las guías.</p>

  <a class="btn" href="https://herrero-planos-pro.lovable.app" target="_blank" rel="noopener noreferrer">ACCEDER A MI APP</a>

  <p class="tip">Guarda este enlace o agrega la página a tu pantalla de inicio para acceder más rápido la próxima vez.</p>

  <div class="guard">
    <span class="guard__ico" aria-hidden="true">✓</span>
    <span class="guard__txt">
      <strong>Garantía de 7 días</strong>
      Si algo no funciona, te devolvemos tu dinero.
    </span>
  </div>
</main>

</body>
</html>
